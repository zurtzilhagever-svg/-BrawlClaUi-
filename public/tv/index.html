<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrawlClaUi · TV</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main class="screen">
    <section class="arena-wrap"><canvas id="arena" width="1200" height="900" aria-label="BrawlClaUi arena"></canvas><div id="toast" role="status"></div></section>
    <aside class="lobby">
      <p class="eyebrow">COUCH BRAWL</p><h1>Join the brawl</h1>
      <p class="label">ROOM CODE</p><output id="room-code" class="room-code">----</output>
      <img id="qr" alt="QR code to open the mobile controller"><p class="hint">Scan with your phone camera</p>
      <div class="players"><span>PLAYERS</span><strong id="player-count">0 / 8</strong></div><ul id="player-list"></ul>
    </aside>
  </main>
  <script src="/socket.io/socket.io.js"></script><script src="/shared/qr-generator.js"></script><script src="/shared/gamepad.js"></script><script src="host.js"></script>
</body></html>
