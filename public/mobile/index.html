<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101525"><title>CouchBrawl Controller</title><link rel="stylesheet" href="style.css"></head>
<body><section id="join" class="panel"><p class="brand">COUCH BRAWL</p><h1>Ready to brawl?</h1><input id="name" maxlength="14" placeholder="Your name" autocomplete="nickname"><input id="room" maxlength="4" placeholder="ROOM CODE" autocomplete="off"><button id="join-button">JOIN GAME</button><p id="join-error" role="alert"></p></section>
<main id="controller" hidden><header><span class="brand">COUCH BRAWL</span><span id="status">CONNECTED</span></header><section class="controls"><div id="stick-zone" aria-label="Movement joystick"><div id="stick-base"><div id="stick-knob"></div></div><span>MOVE</span></div><div class="buttons"><button id="attack" class="action attack">ATTACK</button><button id="special" class="action special">SPECIAL</button></div></section></main>
<script src="/socket.io/socket.io.js"></script><script src="/shared/gamepad.js"></script><script src="controller.js"></script></body></html>
